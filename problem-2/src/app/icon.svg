<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#333456"/>
      <stop offset="1" stop-color="#060930"/>
    </linearGradient>
    <!-- userSpaceOnUse: a horizontal line has a zero-height bounding box, so a bbox gradient would not paint it -->
    <linearGradient id="arrow" gradientUnits="userSpaceOnUse" x1="14" y1="15" x2="50" y2="49">
      <stop offset="0" stop-color="#f4abc4"/>
      <stop offset="1" stop-color="#fa89b0"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#bg)"/>
  <g fill="none" stroke="url(#arrow)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- top arrow: pointing right -->
    <path d="M14 24h34"/>
    <path d="M40 15l9 9-9 9"/>
    <!-- bottom arrow: pointing left -->
    <path d="M50 40H16"/>
    <path d="M24 31l-9 9 9 9"/>
  </g>
</svg>
